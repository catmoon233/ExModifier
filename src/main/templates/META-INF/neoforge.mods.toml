# This is an example neoforge.mods.toml file. It contains the data relating to the loading mods.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="exmodifier.mixins.json"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="jei"
type="optional"
versionRange="[19.8.4.110,)"
ordering="NONE"
side="CLIENT"

[[dependencies."${mod_id}"]]
modId="curios"
type="optional"
versionRange="[0,)"
ordering="NONE"
side="BOTH"


[[dependencies."${mod_id}"]]
modId="irons_spellbooks"
type="optional"
versionRange="[0,)"
ordering="NONE"
side="BOTH"
